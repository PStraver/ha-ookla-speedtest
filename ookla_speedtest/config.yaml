name: Ookla Speedtest
version: "1.0.4"
slug: ookla_speedtest
description: Betrouwbare internet-speedtest met de officiële Ookla Speedtest CLI
url: https://github.com/PStraver/ha-ookla-speedtest
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
stdin: true
options:
  accept_ookla_license: false
  schedule:
    - "04:00"
    - "14:00"
  server_id: ""
  run_on_start: false
schema:
  accept_ookla_license: bool
  schedule:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  server_id: match(^[0-9]*$)
  run_on_start: bool
